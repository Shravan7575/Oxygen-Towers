<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oxygen Towers | North City Developers</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f8;
    color:#172033;
}

/* ================= HEADER ================= */

header{
    background:linear-gradient(135deg,#073b4c,#087e8b);
    color:white;
    text-align:center;
    padding:35px 15px;
}

header h1{
    margin:0;
    font-size:30px;
    letter-spacing:1px;
}

header p{
    margin:7px 0;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* ================= STATISTICS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat-box{
    background:white;
    border-radius:15px;
    padding:18px 10px;
    text-align:center;
    box-shadow:0 3px 12px #0001;
}

.stat-box b{
    display:block;
    font-size:28px;
    margin-bottom:5px;
}

.available-stat b{
    color:#159957;
}

.sold-stat b{
    color:#d64545;
}

.mortgage-stat b{
    color:#087e8b;
}

.city-stat b{
    color:#7950f2;
}

.mestri-stat b{
    color:#d68910;
}

.rmc-stat b{
    color:#8e44ad;
}

.stat-label{
    font-size:13px;
    color:#555;
}

/* ================= FILTERS ================= */

.filters{
    background:white;
    padding:16px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 3px 12px #0001;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:10px;
    font-size:15px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#087e8b;
}

.row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

/* ================= FLOOR ================= */

.floor{
    margin-bottom:30px;
}

.floor h2{
    font-size:21px;
    margin:0 0 12px;
    padding-bottom:8px;
    border-bottom:2px solid #087e8b;
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

/* ================= CARD ================= */

.card{
    background:white;
    padding:16px;
    border-radius:14px;
    border-left:5px solid #19a974;
    box-shadow:0 3px 12px #0001;
    transition:transform .15s ease, box-shadow .15s ease;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px #0002;
}

/* AVAILABLE */

.card.available-card{
    border-left-color:#19a974;
}

/* SOLD */

.card.sold-card{
    border-left-color:#d64545;
    background:#fffafa;
}

/* MORTGAGE */

.card.mortgage-card{
    border-left-color:#087e8b;
    background:#f7fcfd;
}

/* CITY LEVEL */

.card.city-card{
    border-left-color:#7950f2;
    background:#faf9ff;
}

/* VENDOR MESTRI */

.card.mestri-card{
    border-left-color:#f39c12;
    background:#fffaf2;
}

/* VENDOR RMC */

.card.rmc-card{
    border-left-color:#8e44ad;
    background:#fbf8ff;
}

/* ================= FLAT ================= */

.flat{
    font-size:20px;
    font-weight:bold;
}

/* ================= STATUS ================= */

.status{
    font-size:13px;
    font-weight:bold;
    margin:6px 0 8px;
}

/* Status colors */

.status-AVAILABLE{
    color:#159957;
}

.status-SOLD{
    color:#d64545;
}

.status-MORTGAGE{
    color:#087e8b;
}

.status-CITY{
    color:#7950f2;
}

.status-MESTRI{
    color:#d68910;
}

.status-RMC{
    color:#8e44ad;
}

/* ================= DETAILS ================= */

.details{
    line-height:1.7;
    color:#555;
    font-size:14px;
}

/* ================= PRICE ================= */

.price{
    font-size:17px;
    font-weight:bold;
    margin-top:8px;
}

/* ================= WHATSAPP ================= */

.whatsapp{
    display:block;
    text-align:center;
    background:#25d366;
    color:white;
    text-decoration:none;
    padding:10px;
    border-radius:8px;
    margin-top:12px;
    font-weight:bold;
    transition:background .15s ease;
}

.whatsapp:hover{
    background:#1ebe5d;
}

/* ================= NO RESULTS ================= */

.empty{
    text-align:center;
    padding:40px;
    color:#777;
    background:white;
    border-radius:15px;
    box-shadow:0 3px 12px #0001;
}

/* ================= LEGEND ================= */

.legend{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 3px 12px #0001;
}

.legend-title{
    font-weight:bold;
    margin-bottom:10px;
}

.legend-items{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.legend-item{
    font-size:13px;
    font-weight:bold;
}

.legend-dot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    margin-right:5px;
}

.dot-available{
    background:#19a974;
}

.dot-sold{
    background:#d64545;
}

.dot-mortgage{
    background:#087e8b;
}

.dot-city{
    background:#7950f2;
}

.dot-mestri{
    background:#f39c12;
}

.dot-rmc{
    background:#8e44ad;
}

/* ================= MOBILE ================= */

@media(max-width:1050px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .grid{
        grid-template-columns:repeat(3,1fr);
    }

    .row{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:700px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .row{
        grid-template-columns:repeat(2,1fr);
    }

    header h1{
        font-size:25px;
    }

}

@media(max-width:500px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:1fr;
    }

    .row{
        grid-template-columns:1fr;
    }

    .legend-items{
        flex-direction:column;
        gap:8px;
    }

}

</style>

</head>

===================================================== */

        document
        .getElementById("search")

        .trim()

        document
        .getElementById("bhk")
        .value;

            const flatFacing = x[2];
            const flatBhk = x[3];
            const flatStatus = x[6];

                number
                .toLowerCase()
                .includes(search)

                    !bhk ||
                    String(flatBhk) === bhk
                )

                &&

                (
                    !floor ||
                    flatFloor === floor
                )

                &&

                (
                    !facing ||
                    flatFacing === facing
                )

                &&

                (
                    !status ||
                    flatStatus === status
                )

        .getElementById("availableCount")
        .textContent =
        flats.filter(
            x => x[6] === "AVAILABLE"
        ).length;


    document
        .getElementById("soldCount")
        .textContent =
        flats.filter(
            x => x[6] === "SOLD"
        ).length;

        .getElementById("mortgageCount")

        flats.filter(
            x => x[6] === "VENDOR-RMC"

        document.getElementById("app");

        app.innerHTML = `
            <div class="empty">
                No flats found.
            </div>
        `;

        return;

    }


    /* ================= FLOORS ================= */

    floors.forEach(floorName => {


        const list =
            results.filter(
                x => x[1] === floorName
            );


        if(!list.length){
            return;
        }


        const section =
            document.createElement("section");


        section.className =
            "floor";


        section.innerHTML = `
            <h2>${floorName} Floor</h2>
            <div class="grid"></div>
        `;


        const grid =
            section.querySelector(".grid");


        /* ================= CARDS ================= */

        list.forEach(x => {


            const [

                flatFloor,
                flatFacing,
                flatBhk,
                area,
                price,
                flatStatus
            ] = x;


            const card =
                document.createElement("div");

                cardClass(flatStatus);
