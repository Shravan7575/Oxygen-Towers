<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oxygen Towers | NorthCity Developers</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f6fa;
    color:#172033;
    line-height:1.4;
}

/* =========================================================
   TOP LOGO
========================================================= */

.logo-area{
    width:100%;
    background:#fff;
    padding:10px 15px 8px;
    text-align:center;
    border-bottom:1px solid #e4e8ee;
}

.logo-area img{
    width:auto;
    max-width:230px;
    height:70px;
    object-fit:contain;
    display:block;
    margin:auto;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    background:
        linear-gradient(135deg,#075ea8,#0c82c9 55%,#164e88);
    color:#fff;
    padding:24px 18px 22px;
    text-align:center;
}

.hero h1{
    font-size:30px;
    font-weight:800;
    margin-bottom:5px;
}

.hero p{
    font-size:14px;
    opacity:.92;
}

/* =========================================================
   QUICK STATS
========================================================= */

.stats{
    max-width:1250px;
    margin:-18px auto 18px;
    padding:0 14px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    position:relative;
    z-index:2;
}

.stat{
    background:#fff;
    border-radius:9px;
    padding:11px 7px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    border:1px solid #e6eaf0;
}

.stat-number{
    font-size:21px;
    font-weight:800;
    color:#0867ad;
}

.stat-label{
    margin-top:2px;
    font-size:10px;
    color:#687386;
    text-transform:uppercase;
    font-weight:700;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
    max-width:1250px;
    margin:0 auto;
    padding:0 14px 35px;
}

/* =========================================================
   FILTER PANEL
========================================================= */

.filter-panel{
    background:#fff;
    border-radius:11px;
    padding:13px;
    margin-bottom:15px;
    border:1px solid #e1e6ec;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.block-switch{
    display:flex;
    gap:7px;
    margin-bottom:11px;
    flex-wrap:wrap;
}

.block-btn{
    border:1px solid #d4dae2;
    background:#f8fafc;
    padding:7px 17px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    color:#455164;
}

.block-btn.active{
    background:#096db5;
    border-color:#096db5;
    color:#fff;
}

.filters{
    display:grid;
    grid-template-columns:2fr repeat(5,1fr);
    gap:8px;
}

.filters input,
.filters select{
    width:100%;
    height:37px;
    border:1px solid #d7dde5;
    border-radius:6px;
    padding:0 9px;
    font-size:12px;
    color:#293448;
    background:#fff;
    outline:none;
}

.filters input:focus,
.filters select:focus{
    border-color:#1383c9;
}

/* =========================================================
   FLOOR
========================================================= */

.floor-section{
    margin-bottom:11px;
    background:#fff;
    border:1px solid #e0e5eb;
    border-radius:9px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.035);
}

.floor-header{
    width:100%;
    border:0;
    background:#f8fafc;
    padding:9px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    color:#1c2a3d;
}

.floor-title{
    font-size:13px;
    font-weight:800;
}

.floor-count{
    font-size:10px;
    font-weight:700;
    color:#16804c;
}

.floor-arrow{
    font-size:14px;
    transition:.2s;
}

.floor-section.open .floor-arrow{
    transform:rotate(180deg);
}

.floor-content{
    display:none;
    padding:9px;
    border-top:1px solid #edf0f3;
}

.floor-section.open .floor-content{
    display:block;
}

/* =========================================================
   FLAT GRID
========================================================= */

.flat-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:8px;
}

/* =========================================================
   FLAT CARD
========================================================= */

.flat-card{
    position:relative;
    background:#fff;
    border:1px solid #dfe4ea;
    border-radius:7px;
    padding:8px 9px 8px 12px;
    min-width:0;
    overflow:hidden;
    transition:.18s ease;
}

/* Colored individual line */

.flat-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:#159447;
}

.flat-card:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 13px rgba(0,0,0,.09);
}

/* Available */

.flat-card.available::before{
    background:#18a957;
}

/* Sold */

.flat-card.sold::before{
    background:#e53935;
}

/* Mortgage */

.flat-card.mortgage::before{
    background:#f39c12;
}

/* City Level */

.flat-card.city::before{
    background:#7b4bd1;
}

/* Vendor */

.flat-card.vendor::before{
    background:#1682c4;
}

/* RMC */

.flat-card.rmc::before{
    background:#e05b20;
}

/* =========================================================
   FLAT HEADER
========================================================= */

.flat-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:5px;
    margin-bottom:5px;
}

/*
 IMPORTANT:
 Prevent Flat 204 from breaking into two lines
*/

.flat-number{
    font-size:14px;
    font-weight:800;
    color:#162235;
    white-space:nowrap;
    line-height:1.1;
    min-width:0;
}

.status-badge{
    flex-shrink:0;
    font-size:8px;
    line-height:1;
    padding:4px 5px;
    border-radius:20px;
    font-weight:800;
    white-space:nowrap;
    text-transform:uppercase;
}

.badge-available{
    background:#e5f8ed;
    color:#168345;
}

.badge-sold{
    background:#fde9e9;
    color:#d52f2f;
}

.badge-mortgage{
    background:#fff3dc;
    color:#b96d00;
}

.badge-city{
    background:#eee8fb;
    color:#7040bd;
}

.badge-vendor{
    background:#e6f3fb;
    color:#0873af;
}

.badge-rmc{
    background:#fff0e8;
    color:#c95018;
}

/* =========================================================
   FLAT DETAILS
========================================================= */

.flat-details{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:4px 7px;
    margin-bottom:6px;
}

.detail{
    min-width:0;
    font-size:10px;
    color:#657083;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.detail strong{
    color:#253247;
    font-size:10px;
    font-weight:700;
}

.flat-price{
    font-size:13px;
    font-weight:800;
    color:#0869ae;
    margin:2px 0;
    white-space:nowrap;
}

.gst-note{
    font-size:8px;
    color:#8a94a4;
    white-space:nowrap;
}

/* =========================================================
   WHATSAPP BUTTON
========================================================= */

.whatsapp-btn{
    display:block;
    text-align:center;
    background:#20a85a;
    color:#fff;
    text-decoration:none;
    border-radius:5px;
    padding:5px 6px;
    margin-top:6px;
    font-size:9px;
    font-weight:800;
}

.whatsapp-btn:hover{
    background:#168a49;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    padding:30px;
    text-align:center;
    color:#7a8594;
    font-size:13px;
}

/* =========================================================
   LEGEND
========================================================= */

.legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin:15px 0;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:10px;
    color:#657083;
}

.legend-line{
    width:13px;
    height:13px;
    border-radius:3px;
}

.legend-available{background:#18a957;}
.legend-sold{background:#e53935;}
.legend-mortgage{background:#f39c12;}
.legend-city{background:#7b4bd1;}
.legend-vendor{background:#1682c4;}
.legend-rmc{background:#e05b20;}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    text-align:center;
    padding:20px 10px;
    color:#7a8594;
    font-size:10px;
}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .filters{
        grid-template-columns:repeat(3,1fr);
    }

    .filters input{
        grid-column:span 3;
    }

    .flat-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .logo-area{
        padding:7px 10px;
    }

    .logo-area img{
        max-width:190px;
        height:58px;
    }

    .hero{
        padding:18px 12px;
    }

    .hero h1{
        font-size:23px;
    }

    .hero p{
        font-size:12px;
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
        gap:6px;
        padding:0 8px;
        margin-top:-12px;
    }

    .stat{
        padding:8px 4px;
    }

    .stat-number{
        font-size:17px;
    }

    .stat-label{
        font-size:8px;
    }

    .container{
        padding:0 8px 25px;
    }

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

    .filters input{
        grid-column:span 2;
    }

    .flat-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
    }

    .flat-card{
        padding:7px 7px 7px 10px;
    }

    .flat-number{
        font-size:12px;
    }

    .status-badge{
        font-size:7px;
        padding:3px 4px;
    }

    .detail,
    .detail strong{
        font-size:9px;
    }

    .flat-price{
        font-size:11px;
    }

    .gst-note{
        font-size:7px;
    }

    .whatsapp-btn{
        font-size:8px;
        padding:5px 3px;
    }
}

/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:390px){

    .flat-grid{
        grid-template-columns:1fr 1fr;
    }

    .flat-top{
        align-items:flex-start;
    }

    .flat-number{
        font-size:11px;
    }

    .status-badge{
        font-size:6px;
    }

    .flat-details{
        gap:3px;
    }

    .detail,
    .detail strong{
        font-size:8px;
    }

    .flat-price{
        font-size:10px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     NORTHCITY LOGO
======================================================== -->

<div class="logo-area">
    <img
        src="northcity-logo.png"
        alt="NorthCity Developers"
        onerror="this.style.display='none'"
    >
</div>

<!-- =======================================================
     HERO
======================================================== -->

<section class="hero">
    <h1>Oxygen Towers</h1>
    <p>Premium Residential Apartments | NorthCity Developers</p>
</section>

<!-- =======================================================
     STATS
======================================================== -->

<div class="stats">

    <div class="stat">
        <div class="stat-number" id="availableCount">0</div>
        <div class="stat-label">Available</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="soldCount">0</div>
        <div class="stat-label">Sold</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="mortgageCount">0</div>
        <div class="stat-label">Mortgage</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="cityCount">0</div>
        <div class="stat-label">City Level</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="vendorCount">0</div>
        <div class="stat-label">Vendor</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="rmcCount">0</div>
        <div class="stat-label">Vendor RMC</div>
    </div>

</div>

<!-- =======================================================
     MAIN
======================================================== -->

<main class="container">

    <!-- FILTERS -->

    <section class="filter-panel">

        <div class="block-switch">

            <button
                class="block-btn active"
                data-block="ALL"
                onclick="setBlock('ALL')">
                All Blocks
            </button>

            <button
                class="block-btn"
                data-block="A"
                onclick="setBlock('A')">
                Block A
            </button>

            <button
                class="block-btn"
                data-block="B"
                onclick="setBlock('B')">
                Block B
            </button>

        </div>

        <div class="filters">

            <input
                type="text"
                id="search"
                placeholder="Search Flat No..."
                oninput="render()"
            >

            <select id="status" onchange="render()">
                <option value="">All Status</option>
                <option value="AVAILABLE">Available</option>
                <option value="SOLD">Sold</option>
                <option value="MORTGAGE">Mortgage</option>
                <option value="CITY">City Level</option>
                <option value="VENDOR">Vendor</option>
                <option value="RMC">Vendor RMC</option>
            </select>

            <select id="bhk" onchange="render()">
                <option value="">All BHK</option>
                <option value="2 BHK">2 BHK</option>
                <option value="3 BHK">3 BHK</option>
                <option value="4 BHK">4 BHK</option>
            </select>

            <select id="floor" onchange="render()">
                <option value="">All Floors</option>
            </select>

            <select id="facing" onchange="render()">
                <option value="">All Facing</option>
            </select>

            <select id="sort" onchange="render()">
                <option value="">Default Order</option>
                <option value="flatAsc">Flat No ↑</option>
                <option value="flatDesc">Flat No ↓</option>
                <option value="priceAsc">Price ↑</option>
                <option value="priceDesc">Price ↓</option>
                <option value="areaAsc">Area ↑</option>
                <option value="areaDesc">Area ↓</option>
            </select>

        </div>

    </section>

    <!-- LEGEND -->

    <div class="legend">

        <div class="legend-item">
            <span class="legend-line legend-available"></span>
            Available
        </div>

        <div class="legend-item">
            <span class="legend-line legend-sold"></span>
            Sold
        </div>

        <div class="legend-item">
            <span class="legend-line legend-mortgage"></span>
            Mortgage
        </div>

        <div class="legend-item">
            <span class="legend-line legend-city"></span>
            City Level
        </div>

        <div class="legend-item">
            <span class="legend-line legend-vendor"></span>
            Vendor
        </div>

        <div class="legend-item">
            <span class="legend-line legend-rmc"></span>
            RMC
        </div>

    </div>

    <!-- FLATS -->

    <div id="floorContainer"></div>

</main>

<footer class="footer">
    © NorthCity Developers | Oxygen Towers
</footer>


<script>

/* =========================================================
   YOUR EXISTING DATA
=========================================================

   KEEP YOUR CURRENT A AND B ARRAYS HERE.

   Format:

   [
      Flat Number,
      Floor,
      Facing,
      BHK,
      Area,
      Price,
      Status,
      Remark
   ]

   Example:
*/

const A = [

    ["101",1,"East","2 BHK",1250,"₹85 Lakh","AVAILABLE",""],
    ["102",1,"West","2 BHK",1280,"₹87 Lakh","SOLD",""],
    ["103",1,"North","3 BHK",1560,"₹1.05 Cr","AVAILABLE",""],
    ["104",1,"South","3 BHK",1600,"₹1.08 Cr","SOLD",""],

    ["201",2,"East","2 BHK",1250,"₹85 Lakh","AVAILABLE",""],
    ["202",2,"West","2 BHK",1280,"₹87 Lakh","SOLD",""],
    ["203",2,"North","3 BHK",1560,"₹1.05 Cr","AVAILABLE",""],
    ["204",2,"South","3 BHK",1600,"₹1.08 Cr","AVAILABLE",""],

    ["301",3,"East","2 BHK",1250,"₹85 Lakh","AVAILABLE",""],
    ["302",3,"West","2 BHK",1280,"₹87 Lakh","SOLD",""],
    ["303",3,"North","3 BHK",1560,"₹1.05 Cr","AVAILABLE","Mortgage"],
    ["304",3,"South","3 BHK",1600,"₹1.08 Cr","AVAILABLE","City Level"]

];


/* ---------------------------------------------------------
   REPLACE THIS ARRAY WITH YOUR ORIGINAL BLOCK B DATA
--------------------------------------------------------- */

const B = [

    ["101",1,"East","2 BHK",1250,"₹85 Lakh","AVAILABLE",""],
    ["102",1,"West","2 BHK",1280,"₹87 Lakh","SOLD",""],
    ["103",1,"North","3 BHK",1560,"₹1.05 Cr","AVAILABLE",""],
    ["104",1,"South","3 BHK",1600,"₹1.08 Cr","SOLD",""],

    ["201",2,"East","2 BHK",1250,"₹85 Lakh","AVAILABLE",""],
    ["202",2,"West","2 BHK",1280,"₹87 Lakh","AVAILABLE",""],
    ["203",2,"North","3 BHK",1560,"₹1.05 Cr","SOLD",""],
    ["204",2,"South","3 BHK",1600,"₹1.08 Cr","AVAILABLE",""],

    ["301",3,"East","2 BHK",1250,"₹85 Lakh","AVAILABLE",""],
    ["302",3,"West","2 BHK",1280,"₹87 Lakh","SOLD",""],
    ["303",3,"North","3 BHK",1560,"₹1.05 Cr","AVAILABLE",""],
    ["304",3,"South","3 BHK",1600,"₹1.08 Cr","VENDOR",""]

];


/* =========================================================
   VARIABLES
========================================================= */

let currentBlock = "ALL";


/* =========================================================
   GET DATA
========================================================= */

function getData(){

    if(currentBlock === "A"){
        return A;
    }

    if(currentBlock === "B"){
        return B;
    }

    return [...A,...B];
}


/* =========================================================
   BLOCK SWITCH
========================================================= */

function setBlock(block){

    currentBlock = block;

    document.querySelectorAll(".block-btn").forEach(btn => {

        btn.classList.toggle(
            "active",
            btn.dataset.block === block
        );

    });

    populateFilters();
    render();
}


/* =========================================================
   POPULATE FILTERS
========================================================= */

function populateFilters(){

    const data = getData();

    const floorSelect =
        document.getElementById("floor");

    const facingSelect =
        document.getElementById("facing");

    const currentFloor =
        floorSelect.value;

    const currentFacing =
        facingSelect.value;


    /* Floors */

    const floors = [
        ...new Set(
            data.map(x => x[1])
        )
    ].sort((a,b)=>a-b);


    floorSelect.innerHTML =
        `<option value="">All Floors</option>`;

    floors.forEach(floor => {

        floorSelect.innerHTML += `
            <option value="${floor}">
                Floor ${floor}
            </option>
        `;

    });


    /* Facing */

    const facings = [
        ...new Set(
            data.map(x => x[2])
        )
    ].sort();


    facingSelect.innerHTML =
        `<option value="">All Facing</option>`;

    facings.forEach(facing => {

        facingSelect.innerHTML += `
            <option value="${facing}">
                ${facing}
            </option>
        `;

    });


    if(
        floors.includes(Number(currentFloor))
    ){
        floorSelect.value =
            currentFloor;
    }

    if(
        facings.includes(currentFacing)
    ){
        facingSelect.value =
            currentFacing;
    }
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const data = getData();

    let available = 0;
    let sold = 0;
    let mortgage = 0;
    let city = 0;
    let vendor = 0;
    let rmc = 0;


    data.forEach(flat => {

        const status = flat[6];
        const remark = flat[7];


        if(status === "AVAILABLE"){
            available++;
        }

        if(status === "SOLD"){
            sold++;
        }

        if(remark === "Mortgage"){
            mortgage++;
        }

        if(remark === "City Level"){
            city++;
        }

        if(status === "VENDOR"){
            vendor++;
        }

        if(status === "VENDOR-RMC"){
            rmc++;
        }

    });


    document.getElementById("availableCount")
        .textContent = available;

    document.getElementById("soldCount")
        .textContent = sold;

    document.getElementById("mortgageCount")
        .textContent = mortgage;

    document.getElementById("cityCount")
        .textContent = city;

    document.getElementById("vendorCount")
        .textContent = vendor;

    document.getElementById("rmcCount")
        .textContent = rmc;
}


/* =========================================================
   VISUAL CLASS
========================================================= */

function visualClass(flat){

    const status = flat[6];
    const remark = flat[7];


    if(remark === "Mortgage"){
        return "mortgage";
    }

    if(remark === "City Level"){
        return "city";
    }

    if(status === "SOLD"){
        return "sold";
    }

    if(status === "VENDOR"){
        return "vendor";
    }

    if(status === "VENDOR-RMC"){
        return "rmc";
    }

    return "available";
}


/* =========================================================
   BADGE
========================================================= */

function visualBadge(flat){

    const status = flat[6];
    const remark = flat[7];


    if(remark === "Mortgage"){
        return `
            <span class="status-badge badge-mortgage">
                Mortgage
            </span>
        `;
    }

    if(remark === "City Level"){
        return `
            <span class="status-badge badge-city">
                City Level
            </span>
        `;
    }

    if(status === "SOLD"){
        return `
            <span class="status-badge badge-sold">
                Sold
            </span>
        `;
    }

    if(status === "VENDOR"){
        return `
            <span class="status-badge badge-vendor">
                Vendor
            </span>
        `;
    }

    if(status === "VENDOR-RMC"){
        return `
            <span class="status-badge badge-rmc">
                RMC
            </span>
        `;
    }

    return `
        <span class="status-badge badge-available">
            Available
        </span>
    `;
}


/* =========================================================
   FILTER DATA
========================================================= */

function getFilteredData(){

    let data = getData();


    const search =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const status =
        document.getElementById("status").value;


    const bhk =
        document.getElementById("bhk").value;


    const floor =
        document.getElementById("floor").value;


    const facing =
        document.getElementById("facing").value;


    const sort =
        document.getElementById("sort").value;


    data = data.filter(flat => {

        const flatNo =
            String(flat[0]).toLowerCase();


        if(
            search &&
            !flatNo.includes(search)
        ){
            return false;
        }


        if(status === "AVAILABLE"){

            if(flat[6] !== "AVAILABLE"){
                return false;
            }

        }


        if(status === "SOLD"){

            if(flat[6] !== "SOLD"){
                return false;
            }

        }


        if(status === "MORTGAGE"){

            if(flat[7] !== "Mortgage"){
                return false;
            }

        }


        if(status === "CITY"){

            if(flat[7] !== "City Level"){
                return false;
            }

        }


        if(status === "VENDOR"){

            if(flat[6] !== "VENDOR"){
                return false;
            }

        }


        if(status === "RMC"){

            if(flat[6] !== "VENDOR-RMC"){
                return false;
            }

        }


        if(
            bhk &&
            flat[3] !== bhk
        ){
            return false;
        }


        if(
            floor &&
            Number(flat[1]) !== Number(floor)
        ){
            return false;
        }


        if(
            facing &&
            flat[2] !== facing
        ){
            return false;
        }


        return true;

    });


    /* SORT */

    if(sort === "flatAsc"){

        data.sort(
            (a,b) =>
            Number(a[0]) - Number(b[0])
        );

    }

    if(sort === "flatDesc"){

        data.sort(
            (a,b) =>
            Number(b[0]) - Number(a[0])
        );

    }

    if(sort === "priceAsc"){

        data.sort(
            (a,b) =>
            priceNumber(a[5]) -
            priceNumber(b[5])
        );

    }

    if(sort === "priceDesc"){

        data.sort(
            (a,b) =>
            priceNumber(b[5]) -
            priceNumber(a[5])
        );

    }

    if(sort === "areaAsc"){

        data.sort(
            (a,b) =>
            Number(a[4]) -
            Number(b[4])
        );

    }

    if(sort === "areaDesc"){

        data.sort(
            (a,b) =>
            Number(b[4]) -
            Number(a[4])
        );

    }


    return data;
}


/* =========================================================
   PRICE NUMBER
========================================================= */

function priceNumber(value){

    if(typeof value === "number"){
        return value;
    }

    const str =
        String(value)
        .replace(/[^0-9.]/g,"");

    return Number(str) || 0;
}


/* =========================================================
   WHATSAPP
========================================================= */

function whatsappLink(flat, block){

    const message =
        `Hello NorthCity Developers,%0A%0A` +
        `I am interested in Flat ${flat[0]} ` +
        `(${flat[3]}) in Block ${block}.%0A` +
        `Area: ${flat[4]} sq.ft.%0A` +
        `Facing: ${flat[2]}%0A%0A` +
        `Please share more details.`;

    return `
        <a
            class="whatsapp-btn"
            target="_blank"
            href="https://wa.me/917386326575?text=${message}">
            WhatsApp Enquiry
        </a>
    `;
}


/* =========================================================
   APARTMENT CARD
========================================================= */

function apartmentCard(flat){

    const block =
        A.includes(flat)
            ? "A"
            : "B";


    const className =
        visualClass(flat);


    const enquiry =
        flat[6] === "AVAILABLE"
            ? whatsappLink(flat, block)
            : "";


    return `

        <div class="flat-card ${className}">

            <div class="flat-top">

                <div class="flat-number">
                    Flat ${flat[0]}
                </div>

                ${visualBadge(flat)}

            </div>


            <div class="flat-details">

                <div class="detail">
                    <strong>${flat[3]}</strong>
                </div>

                <div class="detail">
                    <strong>${flat[4]}</strong> sq.ft.
                </div>

                <div class="detail">
                    ${flat[2]} Facing
                </div>

                <div class="detail">
                    Block ${block}
                </div>

            </div>


            <div class="flat-price">
                ${flat[5]}
            </div>


            <div class="gst-note">
                * GST / charges extra as applicable
            </div>


            ${enquiry}

        </div>

    `;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const container =
        document.getElementById("floorContainer");


    const data =
        getFilteredData();


    container.innerHTML = "";


    if(data.length === 0){

        container.innerHTML = `
            <div class="empty">
                No flats found for the selected filters.
            </div>
        `;

        updateStats();
        return;
    }


    const floors = [
        ...new Set(
            data.map(flat => flat[1])
        )
    ].sort((a,b)=>a-b);


    const selectedFloor =
        document.getElementById("floor").value;


    floors.forEach(floor => {

        const flats =
            data.filter(
                flat =>
                Number(flat[1]) === Number(floor)
            );


        const availableCount =
            flats.filter(
                flat =>
                flat[6] === "AVAILABLE"
            ).length;


        const section =
            document.createElement("section");


        section.className =
            "floor-section";


        if(
            selectedFloor &&
            Number(selectedFloor) === Number(floor)
        ){
            section.classList.add("open");
        }


        section.innerHTML = `

            <button
                class="floor-header"
                type="button">

                <span class="floor-title">
                    Floor ${floor}
                </span>

                <span>

                    <span class="floor-count">
                        ${availableCount} Available
                    </span>

                    &nbsp;

                    <span class="floor-arrow">
                        ▼
                    </span>

                </span>

            </button>


            <div class="floor-content">

                <div class="flat-grid">

                    ${flats
                        .map(flat =>
                            apartmentCard(flat)
                        )
                        .join("")
                    }

                </div>

            </div>

        `;


        const header =
            section.querySelector(".floor-header");


        header.addEventListener(
            "click",
            () => {
                section.classList.toggle("open");
            }
        );


        container.appendChild(section);

    });


    updateStats();
}


/* =========================================================
   INITIAL LOAD
========================================================= */

populateFilters();
updateStats();
render();

</script>
