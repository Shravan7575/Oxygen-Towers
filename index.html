
<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Oxygen Towers | NorthCity Developers</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5f9;
  color:#172033;
}
.header{
  background:linear-gradient(135deg,#075985,#0ea5e9);
  color:white;
  padding:22px 16px;
}
.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.logo h1{
  margin:0;
  font-size:30px;
  letter-spacing:1px;
}
.logo .developer{
  margin:4px 0 3px;
  font-size:15px;
  font-weight:700;
}
.logo .subtitle{
  margin:0;
  font-size:13px;
  opacity:.9;
}
.contact{
  text-align:right;
  font-size:14px;
}
.contact strong{
  display:block;
  font-size:16px;
}
.contact a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:18px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-bottom:18px;
}
.stat{
  background:white;
  border-radius:12px;
  padding:14px 10px;
  text-align:center;
  box-shadow:0 2px 8px #00000012;
}
.stat .num{
  font-size:24px;
  font-weight:800;
}
.stat .label{
  font-size:12px;
  margin-top:4px;
  color:#64748b;
}
.filters{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 2px 8px #00000012;
  margin-bottom:18px;
}
.filter-grid{
  display:grid;
  grid-template-columns:2fr repeat(4,1fr) auto;
  gap:10px;
}
input,select,button{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:14px;
}
button{
  cursor:pointer;
  background:#0f172a;
  color:white;
  border:none;
}
.reset{
  background:#64748b;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:12px 0 20px;
}
.legend span{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}
.available{background:#dcfce7;color:#166534}
.sold{background:#fee2e2;color:#991b1b}
.mortgage{background:#fef3c7;color:#92400e}
.city{background:#dbeafe;color:#1e40af}
.vendor{background:#f3e8ff;color:#6b21a8}
.vendor-rmc{background:#fce7f3;color:#9d174d}

.floor-section{
  margin-bottom:24px;
}
.floor-title{
  background:#0f172a;
  color:white;
  padding:11px 14px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:18px;
}
.flat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.flat{
  background:white;
  border-radius:12px;
  padding:14px;
  box-shadow:0 2px 8px #00000012;
  border-left:5px solid #94a3b8;
}
.flat.available-border{border-left-color:#22c55e}
.flat.sold-border{border-left-color:#ef4444}
.flat.mortgage-border{border-left-color:#f59e0b}
.flat.city-border{border-left-color:#3b82f6}
.flat.vendor-border{border-left-color:#a855f7}
.flat.vendor-rmc-border{border-left-color:#ec4899}

.flat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.flat-number{
  font-size:20px;
  font-weight:800;
}
.badge{
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}
.details{
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.detail{
  font-size:12px;
  color:#64748b;
}
.detail strong{
  display:block;
  color:#172033;
  font-size:13px;
  margin-top:2px;
}
.price{
  margin-top:12px;
  font-size:18px;
  font-weight:800;
  color:#075985;
}
.remark{
  margin-top:6px;
  font-size:11px;
  color:#64748b;
}
.whatsapp{
  display:block;
  margin-top:12px;
  padding:10px;
  text-align:center;
  border-radius:8px;
  background:#16a34a;
  color:white;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
}
.empty{
  background:white;
  padding:30px;
  border-radius:12px;
  text-align:center;
  color:#64748b;
}

@media(max-width:1000px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .flat-grid{grid-template-columns:repeat(3,1fr)}
  .filter-grid{grid-template-columns:repeat(3,1fr)}

@media(max-width:650px){

  .filter-grid{grid-template-columns:1fr 1fr}

  .stat{

.stat::before{

const statusNames={
  "AVAILABLE":"AVAILABLE",
  "SOLD":"SOLD",
  "MORTGAGE":"AVAILABLE",
  "CITY":"AVAILABLE",
  "VENDOR":"VENDOR-MESTRI",
  "VENDOR-RMC":"VENDOR-RMC"
};


};

function money(value){
  return "₹" + value.toLocaleString("en-IN");
}

function statusClass(status){
  return status.toLowerCase().replace("-","-");
}

function updateStats(){

  const counts={
    AVAILABLE:0,
    SOLD:0,
    MORTGAGE:0,
    CITY:0,
    VENDOR:0,
    "VENDOR-RMC":0
  };

  flats.forEach(f=>{
    counts[f[6]]++;
  });

  document.getElementById("availableCount").textContent=counts.AVAILABLE;
  document.getElementById("soldCount").textContent=counts.SOLD;
  document.getElementById("mortgageCount").textContent=counts.MORTGAGE;
  document.getElementById("cityCount").textContent=counts.CITY;
  document.getElementById("vendorCount").textContent=counts.VENDOR;
  document.getElementById("vendorRmcCount").textContent=counts["VENDOR-RMC"];
}

function render(){

  const search=document.getElementById("search").value.trim().toLowerCase();
  const status=document.getElementById("status").value;
  const bhk=document.getElementById("bhk").value;
  const floor=document.getElementById("floor").value;
  const facing=document.getElementById("facing").value;

  const results=flats.filter(f=>{
    return (
      f[0].toLowerCase().includes(search) &&
      (!status || f[6]===status) &&
      (!bhk || f[3]===bhk) &&
      (!floor || f[1]===floor) &&
      (!facing || f[2]===facing)
    );
  });

  const app=document.getElementById("app");

  if(results.length===0){
    app.innerHTML='<div class="empty">No flats found for the selected filters.</div>';
    return;
  }

  let html="";

  floors.forEach(currentFloor=>{

    const floorFlats=results.filter(f=>f[1]===currentFloor);

    if(floorFlats.length===0) return;

    html+=`
      <section class="floor-section">
        <div class="floor-title">${currentFloor} Floor</div>
        <div class="flat-grid">
    `;

    floorFlats.forEach(f=>{

      const number=f[0];
      const facing=f[2];
      const bhk=f[3];
      const area=f[4];
      const price=f[5];
      const status=f[6];
      const remark=f[7];

      const cls=status.toLowerCase().replace("-","-");

      const message=
        `Hello, I am interested in Flat ${number} at Oxygen Towers. Please share the details.`;

      html+=`
        <div class="flat ${cls}-border">

          <div class="flat-top">
            <div class="flat-number">Flat ${number}</div>
            <span class="badge ${cls}">
              ${statusNames[status]}
            </span>
          </div>

          <div class="details">

            <div class="detail">
              Facing
              <strong>${facing}</strong>
            </div>

            <div class="detail">
              Configuration
              <strong>${bhk}</strong>
            </div>

            <div class="detail">
              Area
              <strong>${area.toLocaleString("en-IN")} sq.ft</strong>
            </div>

            <div class="detail">
              Floor
              <strong>${currentFloor}</strong>
            </div>

          </div>

          <div class="price">${money(price)}</div>

          <div class="remark">${remark}</div>

          ${
            status==="AVAILABLE"
            ?
            `<a class="whatsapp"
               href="https://wa.me/917386326575?text=${encodeURIComponent(message)}"
               target="_blank">
               💬 WhatsApp Enquiry
             </a>`
            :
            ""
          }

        </div>
      `;
    });

    html+=`
        </div>
      </section>
    `;
  });

  app.innerHTML=html;
}

function resetFilters(){

  document.getElementById("search").value="";
  document.getElementById("status").value="";
  document.getElementById("bhk").value="";
  document.getElementById("floor").value="";
  document.getElementById("facing").value="";

  render();
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("status").addEventListener("change",render);
document.getElementById("bhk").addEventListener("change",render);
document.getElementById("floor").addEventListener("change",render);
document.getElementById("facing").addEventListener("change",render);

updateStats();
render();

</script>
